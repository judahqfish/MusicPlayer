name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install selected launcher icon
        run: |
          rm -f app/src/main/res/drawable/app_icon.xml
          mkdir -p app/src/main/res/drawable
          python - <<'PY'
          import base64
          from pathlib import Path
          src = Path('app/src/main/icon/app_icon.b64').read_text()
          cleaned = ''.join(src.split())
          Path('app/src/main/res/drawable/app_icon.jpg').write_bytes(base64.b64decode(cleaned, validate=False))
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineMusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: musicplayer-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          python - <<'PY'
          import base64
          from pathlib import Path
          src = Path('app/src/main/signing/musicplayer-debug.keystore.b64').read_text()
          cleaned = ''.join(src.split())
          Path.home().joinpath('.android/debug.keystore').write_bytes(base64.b64decode(cleaned, validate=False))
          PY
      - name: Install selected launcher icon
        run: |
          rm -f app/src/main/res/drawable/app_icon_art.xml
          mkdir -p app/src/main/res/drawable-nodpi
          python - <<'PY'
          import base64
          from pathlib import Path
          src = Path('app/src/main/icon/app_icon.b64').read_text()
          cleaned = ''.join(src.split())
          Path('app/src/main/res/drawable-nodpi/app_icon_art.jpg').write_bytes(base64.b64decode(cleaned, validate=False))
          PY
      - name: Patch v0.1.11 UI
        run: python scripts/patch_ui_v0111.py
      - name: Patch v0.1.12 UI
        run: python scripts/patch_ui_v0112.py
      - name: Patch v0.1.13 visualizer UI
        run: python scripts/patch_ui_v0113.py
      - name: Patch v0.1.14 kaleidoscope UI
        run: python scripts/patch_ui_v0114.py
      - name: Patch v0.1.16 playback and screensaver UI
        run: python scripts/patch_ui_v0116.py
      - name: Prepare v0.1.18 visualizer animation imports
        run: python scripts/patch_v0118_prep.py
      - name: Patch v0.1.18 visualizer scenes
        run: python scripts/patch_v0118.py
      - name: Patch v0.1.19 instant playback and continuous visualizer
        run: python scripts/patch_v0119.py
      - name: Patch v0.1.20 responsive colorscape and waveform contrast
        run: python scripts/patch_v0120.py
      - name: Patch v0.1.21 true mirrored wedge kaleidoscope
        run: python scripts/patch_v0121.py
      - name: Patch v0.1.22 strongly audio-driven kaleidoscope
        run: python scripts/patch_v0122.py
      - name: Patch v0.1.23 clipped mirrored wedge and touch interaction
        run: python scripts/patch_v0123.py
      - name: Fix v0.1.23 Compose imports
        run: python scripts/patch_v0123_fix.py
      - name: Patch v0.1.24 calm smoothed kaleidoscope
        run: python scripts/patch_v0124.py
      - name: Patch v0.1.25 hypnotic visualizer redesign
        run: python scripts/patch_v0125.py
      - name: Patch v0.1.28 shader visualizer routing
        run: python scripts/patch_v0128.py
      - name: Patch v0.1.29 visualizer fallback and naming
        run: python scripts/patch_v0129.py
      - name: Patch v0.1.30 proven AGSL visualizer
        run: python scripts/patch_v0130.py
      - name: Patch v0.1.31 pure Compose visualizer
        run: python scripts/patch_v0131.py
      - name: Patch v0.1.34 production AGSL visualizer
        run: python scripts/patch_v0134.py
      - name: Build current debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Download exact v0.1.34 artifact
        uses: actions/download-artifact@v4
        with:
          name: MusicPlayer-v0.1.34-apk
          path: /tmp/historical-v0134
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: judahqfish/MusicPlayer
          run-id: 35203867113
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: In-place upgrade plus runtime visualizer test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            set -eux
            test -f /tmp/historical-v0134/app-debug.apk
            adb install /tmp/historical-v0134/app-debug.apk
            adb shell dumpsys package com.everywhen.offlinemusic | grep -E 'versionCode=|versionName='
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package com.everywhen.offlinemusic | grep -E 'versionCode=|versionName='
            gradle :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-v0.1.35-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

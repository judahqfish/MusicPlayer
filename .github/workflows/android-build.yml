name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          python - <<'PY'
          import base64
          from pathlib import Path
          src = Path('app/src/main/signing/musicplayer-debug.keystore.b64').read_text()
          cleaned = ''.join(src.split())
          Path.home().joinpath('.android/debug.keystore').write_bytes(base64.b64decode(cleaned, validate=False))
          PY
      - name: Install selected launcher icon
        run: |
          rm -f app/src/main/res/drawable/app_icon_art.xml
          mkdir -p app/src/main/res/drawable-nodpi
          python - <<'PY'
          import base64
          from pathlib import Path
          src = Path('app/src/main/icon/app_icon.b64').read_text()
          cleaned = ''.join(src.split())
          Path('app/src/main/res/drawable-nodpi/app_icon_art.jpg').write_bytes(base64.b64decode(cleaned, validate=False))
          PY
      - name: Add expandable playback drawer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/everywhen/offlinemusic/Ui.kt')
          text = p.read_text()
          if 'detectVerticalDragGestures' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.gestures.detectDragGesturesAfterLongPress\n',
                  'import androidx.compose.foundation.gestures.detectDragGesturesAfterLongPress\nimport androidx.compose.foundation.gestures.detectVerticalDragGestures\n'
              )
          start = text.index('@Composable\nfun MiniPlayer')
          end = text.index('\n@Composable\nfun NowPlayingScreen', start)
          replacement = r'''@Composable
          fun MiniPlayer(vm: MainViewModel, onOpen: () -> Unit) {
              val controller by vm.controller.collectAsStateWithLifecycle()
              val speed by vm.speed.collectAsStateWithLifecycle()
              val amplifierDb by vm.amplifierDb.collectAsStateWithLifecycle()
              var playing by remember { mutableStateOf(false) }
              var title by remember { mutableStateOf("") }
              var hasTrack by remember { mutableStateOf(false) }
              var expanded by remember { mutableStateOf(false) }
              var speedMenu by remember { mutableStateOf(false) }
              var dragTotal by remember { mutableFloatStateOf(0f) }

              LaunchedEffect(controller) {
                  while (controller != null) {
                      playing = controller?.isPlaying == true
                      title = controller?.mediaMetadata?.title?.toString().orEmpty()
                      hasTrack = controller?.currentMediaItem != null
                      delay(300)
                  }
              }

              Surface(tonalElevation = 4.dp) {
                  Column(
                      Modifier
                          .fillMaxWidth()
                          .pointerInput(Unit) {
                              detectVerticalDragGestures(
                                  onDragStart = { dragTotal = 0f },
                                  onVerticalDrag = { change, dragAmount ->
                                      change.consume()
                                      dragTotal += dragAmount
                                  },
                                  onDragEnd = {
                                      if (dragTotal < -40f) expanded = true
                                      if (dragTotal > 40f) expanded = false
                                      dragTotal = 0f
                                  },
                                  onDragCancel = { dragTotal = 0f }
                              )
                          }
                          .padding(horizontal = 8.dp, vertical = 2.dp)
                  ) {
                      Row(
                          Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              if (hasTrack) title.ifBlank { "Current track" } else "Playback controls",
                              modifier = Modifier
                                  .weight(1f)
                                  .clickable(enabled = hasTrack, onClick = onOpen)
                                  .padding(horizontal = 8.dp, vertical = 4.dp),
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                              style = MaterialTheme.typography.bodyMedium
                          )
                          IconButton(onClick = { expanded = !expanded }) {
                              Icon(
                                  if (expanded) Icons.Default.KeyboardArrowDown else Icons.Default.KeyboardArrowUp,
                                  if (expanded) "Collapse playback controls" else "Show speed and amplifier"
                              )
                          }
                      }

                      Row(
                          Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = vm::previous, enabled = hasTrack) { Icon(Icons.Default.SkipPrevious, "Previous track") }
                          IconButton(onClick = vm::seekBack, enabled = hasTrack) { Icon(Icons.Default.Replay10, "Back 10 seconds") }
                          FilledIconButton(onClick = vm::playPause, enabled = hasTrack) { Icon(if (playing) Icons.Default.Pause else Icons.Default.PlayArrow, "Play/Pause") }
                          IconButton(onClick = vm::seekForward, enabled = hasTrack) { Icon(Icons.Default.Forward10, "Forward 10 seconds") }
                          IconButton(onClick = vm::next, enabled = hasTrack) { Icon(Icons.Default.SkipNext, "Next track") }
                      }

                      if (expanded) {
                          HorizontalDivider()
                          Row(
                              Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 4.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("Speed", style = MaterialTheme.typography.titleSmall, modifier = Modifier.weight(1f))
                              Box {
                                  TextButton(onClick = { speedMenu = true }) { Text("${speed}×") }
                                  DropdownMenu(speedMenu, { speedMenu = false }) {
                                      listOf(.5f, .75f, 1f, 1.25f, 1.5f, 1.75f, 2f).forEach { s ->
                                          DropdownMenuItem(
                                              text = { Text("${s}×") },
                                              onClick = { vm.setSpeed(s); speedMenu = false }
                                          )
                                      }
                                  }
                              }
                          }
                          Row(
                              Modifier.fillMaxWidth().padding(horizontal = 8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Default.VolumeUp, null)
                              Spacer(Modifier.width(8.dp))
                              Text("Amplifier", style = MaterialTheme.typography.titleSmall, modifier = Modifier.weight(1f))
                              Text(if (amplifierDb < 0.1f) "Off" else "+${"%.1f".format(amplifierDb)} dB")
                          }
                          Slider(
                              value = amplifierDb,
                              onValueChange = vm::setAmplifierDb,
                              valueRange = 0f..12f,
                              steps = 11,
                              modifier = Modifier.padding(horizontal = 12.dp)
                          )
                          Text(
                              "Swipe down to collapse",
                              style = MaterialTheme.typography.labelSmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              modifier = Modifier.align(Alignment.CenterHorizontally).padding(bottom = 4.dp)
                          )
                      }
                  }
              }
          }
          '''.replace('\n          ', '\n').lstrip()
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Add playlist tag and album pickers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/everywhen/offlinemusic/Ui.kt')
          text = p.read_text()

          text = text.replace(
              '    var addMenu by remember { mutableStateOf(false) }\n    val files = rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { if (it.isNotEmpty()) vm.importFiles(it, detail.id) }',
              '    var addMenu by remember { mutableStateOf(false) }\n    var addByTag by remember { mutableStateOf(false) }\n    var addByAlbum by remember { mutableStateOf(false) }\n    val files = rememberLauncherForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { if (it.isNotEmpty()) vm.importFiles(it, detail.id) }',
              1
          )

          text = text.replace(
              '                    DropdownMenuItem({ Text("Choose files") }, { addMenu = false; files.launch(arrayOf("audio/*")) })\n                    DropdownMenuItem({ Text("Choose folder") }, { addMenu = false; folder.launch(null) })',
              '                    DropdownMenuItem({ Text("From tags") }, { addMenu = false; addByTag = true })\n                    DropdownMenuItem({ Text("From albums") }, { addMenu = false; addByAlbum = true })\n                    DropdownMenuItem({ Text("Choose files") }, { addMenu = false; files.launch(arrayOf("audio/*")) })\n                    DropdownMenuItem({ Text("Choose folder") }, { addMenu = false; folder.launch(null) })',
              1
          )

          old_end = '''        } else {
              TrackList(displayed, vm, onPlay = { vm.playTracks(displayed, it.id) }, playlistId = detail.id)
          }
      }
          }
          
          @Composable
          fun PlaylistTrackList('''.replace('\n          ', '\n').lstrip()
          new_end = '''        } else {
              TrackList(displayed, vm, onPlay = { vm.playTracks(displayed, it.id) }, playlistId = detail.id)
          }
      }
      if (addByTag) PlaylistTagAddDialog(vm, detail.id, onDismiss = { addByTag = false })
      if (addByAlbum) PlaylistAlbumAddDialog(vm, detail.id, onDismiss = { addByAlbum = false })
          }
          
          @Composable
          fun PlaylistTrackList('''.replace('\n          ', '\n').lstrip()
          if old_end not in text:
              raise SystemExit('PlaylistDetail ending not found')
          text = text.replace(old_end, new_end, 1)

          marker = '@Composable\nfun PlaylistTrackList('
          helpers = r'''@Composable
          fun PlaylistTagAddDialog(vm: MainViewModel, playlistId: Long, onDismiss: () -> Unit) {
              val tags by vm.tags.collectAsStateWithLifecycle()
              var selectedIds by remember { mutableStateOf<Set<Long>>(emptySet()) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Add from tags") },
                  text = {
                      if (tags.isEmpty()) {
                          Text("No tags yet.")
                      } else {
                          LazyColumn(Modifier.heightIn(max = 480.dp)) {
                              items(tags, key = { it.id }) { tag ->
                                  PlaylistTagPickerRow(tag, vm, selectedIds) { selectedIds = it }
                                  HorizontalDivider()
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(
                          enabled = selectedIds.isNotEmpty(),
                          onClick = { vm.addTracksToPlaylist(selectedIds, playlistId); onDismiss() }
                      ) { Text("Add ${selectedIds.size}") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } }
              )
          }
          
          @Composable
          private fun PlaylistTagPickerRow(
              tag: TagSummary,
              vm: MainViewModel,
              selectedIds: Set<Long>,
              onSelectedChange: (Set<Long>) -> Unit
          ) {
              val tracks by vm.repo.observeTagTracks(tag.id).collectAsStateWithLifecycle(initialValue = emptyList())
              var expanded by remember(tag.id) { mutableStateOf(false) }
              val ids = remember(tracks) { tracks.map { it.id }.toSet() }
              val allSelected = ids.isNotEmpty() && ids.all { it in selectedIds }
              Column {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Checkbox(
                          checked = allSelected,
                          enabled = ids.isNotEmpty(),
                          onCheckedChange = { checked ->
                              onSelectedChange(if (checked) selectedIds + ids else selectedIds - ids)
                          }
                      )
                      Column(Modifier.weight(1f).clickable(enabled = ids.isNotEmpty()) {
                          onSelectedChange(if (allSelected) selectedIds - ids else selectedIds + ids)
                      }) {
                          Text(tag.name)
                          Text("${tracks.size} tracks", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      IconButton(onClick = { expanded = !expanded }, enabled = tracks.isNotEmpty()) {
                          Icon(if (expanded) Icons.Default.ExpandLess else Icons.Default.ExpandMore, if (expanded) "Hide tracks" else "Show tracks")
                      }
                  }
                  if (expanded) {
                      tracks.forEach { track ->
                          val checked = track.id in selectedIds
                          Row(
                              Modifier.fillMaxWidth().padding(start = 28.dp).clickable {
                                  onSelectedChange(if (checked) selectedIds - track.id else selectedIds + track.id)
                              },
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Checkbox(checked, onCheckedChange = { value ->
                                  onSelectedChange(if (value) selectedIds + track.id else selectedIds - track.id)
                              })
                              Text(
                                  track.displayName ?: track.fileName.substringBeforeLast('.', track.fileName),
                                  modifier = Modifier.weight(1f),
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }
              }
          }
          
          @Composable
          fun PlaylistAlbumAddDialog(vm: MainViewModel, playlistId: Long, onDismiss: () -> Unit) {
              val allTracks by vm.tracks.collectAsStateWithLifecycle()
              var selectedIds by remember { mutableStateOf<Set<Long>>(emptySet()) }
              val albums = remember(allTracks) {
                  allTracks.groupBy { it.album?.trim()?.takeIf(String::isNotEmpty) ?: "Unknown album" }
                      .toList()
                      .sortedBy { it.first.lowercase() }
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Add from albums") },
                  text = {
                      if (albums.isEmpty()) {
                          Text("No tracks in the library yet.")
                      } else {
                          LazyColumn(Modifier.heightIn(max = 480.dp)) {
                              items(albums, key = { it.first }) { (album, tracks) ->
                                  PlaylistAlbumPickerRow(album, tracks, selectedIds) { selectedIds = it }
                                  HorizontalDivider()
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(
                          enabled = selectedIds.isNotEmpty(),
                          onClick = { vm.addTracksToPlaylist(selectedIds, playlistId); onDismiss() }
                      ) { Text("Add ${selectedIds.size}") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } }
              )
          }
          
          @Composable
          private fun PlaylistAlbumPickerRow(
              album: String,
              tracks: List<TrackEntity>,
              selectedIds: Set<Long>,
              onSelectedChange: (Set<Long>) -> Unit
          ) {
              var expanded by remember(album) { mutableStateOf(false) }
              val ids = remember(tracks) { tracks.map { it.id }.toSet() }
              val allSelected = ids.isNotEmpty() && ids.all { it in selectedIds }
              Column {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Checkbox(
                          checked = allSelected,
                          onCheckedChange = { checked ->
                              onSelectedChange(if (checked) selectedIds + ids else selectedIds - ids)
                          }
                      )
                      Column(Modifier.weight(1f).clickable {
                          onSelectedChange(if (allSelected) selectedIds - ids else selectedIds + ids)
                      }) {
                          Text(album)
                          val artists = tracks.mapNotNull { it.artist?.takeIf(String::isNotBlank) }.distinct()
                          Text(
                              buildString {
                                  if (artists.isNotEmpty()) append(artists.take(2).joinToString(" · ")).append(" · ")
                                  append("${tracks.size} tracks")
                              },
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      IconButton(onClick = { expanded = !expanded }) {
                          Icon(if (expanded) Icons.Default.ExpandLess else Icons.Default.ExpandMore, if (expanded) "Hide tracks" else "Show tracks")
                      }
                  }
                  if (expanded) {
                      tracks.sortedBy { it.fileName.lowercase() }.forEach { track ->
                          val checked = track.id in selectedIds
                          Row(
                              Modifier.fillMaxWidth().padding(start = 28.dp).clickable {
                                  onSelectedChange(if (checked) selectedIds - track.id else selectedIds + track.id)
                              },
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Checkbox(checked, onCheckedChange = { value ->
                                  onSelectedChange(if (value) selectedIds + track.id else selectedIds - track.id)
                              })
                              Column(Modifier.weight(1f)) {
                                  Text(
                                      track.displayName ?: track.fileName.substringBeforeLast('.', track.fileName),
                                      maxLines = 2,
                                      overflow = TextOverflow.Ellipsis
                                  )
                                  track.artist?.takeIf(String::isNotBlank)?.let {
                                      Text(it, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          
          '''.replace('\n          ', '\n').lstrip()
          if marker not in text:
              raise SystemExit('PlaylistTrackList marker not found')
          text = text.replace(marker, helpers + marker, 1)
          p.write_text(text)
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-v0.1.11-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
